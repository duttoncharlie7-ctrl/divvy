name: Divvy Bot Alerts

# Trigger on schedule
on:
  schedule:
    # cron uses UTC time! Adjust accordingly (e.g., CST = UTC-6)
    - cron: '30 13 * * *'   # 7:30 AM CST
    - cron: '22 22 * * *'   # 4:00 PM CST
  workflow_dispatch:       # Allows manual trigger

jobs:
  send_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Divvy alert script
        run: |
          python send_alert.py
